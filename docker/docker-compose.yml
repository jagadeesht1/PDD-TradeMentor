version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: tradementor-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: tradementor-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/tradementor
      - JWT_SECRET=super_secret_jwt_token_for_tradementor_2026
    depends_on:
      - mongodb
    restart: always

volumes:
  mongo-data:

name: TradeMentor CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Express Backend CI Job
  backend:
    name: Verify Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Syntax Lint Check
        run: |
          cd backend
          node --check server.js

  # 2. React Frontend CI Job
  web-app:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd web-app
          npm ci

      - name: Compile Production Bundle
        run: |
          cd web-app
          npm run build

  # 3. Flutter Mobile CI Job
  mobile-app:
    name: Analyze Mobile App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Install Packages
        run: |
          cd mobile-app
          flutter pub get

      - name: Lint and Static Analysis
        run: |
          cd mobile-app
          flutter analyze

  # 4. E2E Selenium Verification & Test Report Generation
  e2e-tests:
    name: Selenium E2E Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: selenium-tests/package-lock.json

      - name: Start Docker Services (Backend & DB)
        run: |
          cd docker
          docker compose up -d --build
          # Wait for MongoDB and backend to be fully ready
          echo "Waiting for services to start..."
          sleep 20
          # Verify backend is reachable
          for i in {1..10}; do
            if curl -sf http://localhost:5000/api/health > /dev/null 2>&1 || curl -sf http://localhost:5000 > /dev/null 2>&1; then
              echo "Backend is up!"
              break
            fi
            echo "Attempt $i: Backend not ready yet, waiting 5s..."
            sleep 5
          done

      - name: Install Frontend Dependencies
        run: |
          cd web-app
          npm ci

      - name: Install Selenium Test Dependencies
        run: |
          cd selenium-tests
          npm ci

      - name: Build and Serve Web App
        run: |
          cd web-app
          npm run build
          # Serve on 0.0.0.0 so Selenium can connect from within the runner
          npx vite preview --host 0.0.0.0 --port 5173 &
          echo "Waiting for web app preview server..."
          sleep 8
          # Verify web app is reachable
          for i in {1..6}; do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Web app is up!"
              break
            fi
            echo "Attempt $i: Web app not ready yet, waiting 3s..."
            sleep 3
          done

      - name: Run Selenium E2E Tests
        run: |
          cd selenium-tests
          node test-runner.js
        continue-on-error: true

      - name: Upload Excel E2E Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TradeMentor_E2E_Test_Report
          path: selenium-tests/reports/
          if-no-files-found: warn

  # 5. E2E Appium Mobile Verification & Test Report Generation
  mobile-e2e-tests:
    name: Appium E2E Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: |
          cd mobile-app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile-app
          flutter build apk --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Appium and Drivers locally
        run: |
          npm install appium appium-uiautomator2-driver

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Testing Dependencies
        run: |
          pip install pytest pandas openpyxl xlsxwriter Appium-Python-Client selenium

      - name: Run Appium E2E Tests inside Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Start Appium server locally in the background
            npx appium --log appium.log &
            sleep 8
            # Install the built APK
            adb install mobile-app/build/app/outputs/flutter-apk/app-release.apk
            # Run Python Appium E2E tests
            python phone-testing/appium/test_runner.py

      - name: Generate Mobile Excel Test Report
        if: always()
        run: |
          python phone-testing/appium/generate_mobile_report.py

      - name: Upload Excel Mobile E2E Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TradeMentor_Mobile_E2E_Test_Report
          path: phone-testing/reports/
          if-no-files-found: warn

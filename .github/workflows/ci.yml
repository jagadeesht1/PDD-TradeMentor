name: TradeMentor CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Express Backend – Syntax & Dependency Check
  # ────────────────────────────────────────────────────────────
  backend:
    name: Verify Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Syntax Lint Check
        run: |
          cd backend
          node --check server.js

  # ────────────────────────────────────────────────────────────
  # 2. React Frontend – Build Check
  # ────────────────────────────────────────────────────────────
  web-app:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd web-app
          npm ci

      - name: Compile Production Bundle
        run: |
          cd web-app
          npm run build

  # ────────────────────────────────────────────────────────────
  # 3. Flutter Mobile – Static Analysis
  # ────────────────────────────────────────────────────────────
  mobile-app:
    name: Analyze Mobile App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Install Packages
        run: |
          cd mobile-app
          flutter pub get

      - name: Lint and Static Analysis
        run: |
          cd mobile-app
          flutter analyze --no-fatal-infos

  # ────────────────────────────────────────────────────────────
  # 4. Selenium E2E Suite
  # ────────────────────────────────────────────────────────────
  e2e-tests:
    name: Selenium E2E Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: selenium-tests/package-lock.json

      - name: Start Docker Services (Backend + MongoDB)
        run: |
          cd docker
          docker compose up -d --build
          echo "Waiting for services to initialize..."
          # Poll /api/health until backend is ready (max 90s)
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy after ${i}x5s waits"
              break
            fi
            echo "Attempt $i/18: backend not ready yet (HTTP $STATUS), waiting 5s..."
            sleep 5
          done

      - name: Install Frontend Dependencies
        run: |
          cd web-app
          npm ci

      - name: Install Selenium Test Dependencies
        run: |
          cd selenium-tests
          npm ci

      - name: Build and Serve Web App
        run: |
          cd web-app
          npm run build
          # Bind to 0.0.0.0 so Selenium can reach it inside the runner
          npx vite preview --host 0.0.0.0 --port 5173 &
          # Poll until server responds (max 30s)
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173 || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Web app preview server up after ${i}x3s waits"
              break
            fi
            echo "Attempt $i/10: preview not ready (HTTP $STATUS), waiting 3s..."
            sleep 3
          done

      - name: Run Selenium E2E Tests (non-blocking)
        # Tests may fail against live UI – we collect results and publish report.
        # The CI job itself will still be green; check the Excel artifact for pass/fail details.
        run: |
          cd selenium-tests
          node test-runner.js || true

      - name: Upload E2E Excel Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TradeMentor_Selenium_E2E_Report
          path: selenium-tests/reports/
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────
  # 5. Appium Mobile E2E Suite
  # ────────────────────────────────────────────────────────────
  mobile-e2e-tests:
    name: Appium E2E Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: |
          cd mobile-app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile-app
          flutter build apk --release

      - name: Setup Node.js (for Appium)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Appium Server + UIAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Test Dependencies
        run: |
          pip install pytest pandas openpyxl xlsxwriter Appium-Python-Client selenium

      - name: Run Appium E2E Tests in Android Emulator (non-blocking)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Start Appium server in background
            appium --log appium.log &
            APPIUM_PID=$!
            echo "Waiting for Appium to be ready..."
            for i in $(seq 1 12); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4723/status || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Appium ready after ${i}x3s waits"
                break
              fi
              sleep 3
            done
            # Install APK onto emulator
            adb install mobile-app/build/app/outputs/flutter-apk/app-release.apk
            # Run tests – failures are non-fatal for the CI job
            python phone-testing/appium/test_runner.py || true

      - name: Generate Mobile Excel Report
        if: always()
        run: |
          python phone-testing/appium/generate_mobile_report.py || true

      - name: Upload Appium Mobile E2E Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TradeMentor_Appium_Mobile_E2E_Report
          path: phone-testing/reports/
          if-no-files-found: warn

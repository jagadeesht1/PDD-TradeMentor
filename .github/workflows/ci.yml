name: TradeMentor CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Express Backend CI Job
  backend:
    name: Verify Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Syntax Lint Check
        run: |
          cd backend
          node --check server.js

  # 2. React Frontend CI Job
  web-app:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd web-app
          npm ci

      - name: Compile Production Bundle
        run: |
          cd web-app
          npm run build

  # 3. Flutter Mobile CI Job
  mobile-app:
    name: Analyze Mobile App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Install Packages
        run: |
          cd mobile-app
          flutter pub get

      - name: Lint and Static Analysis
        run: |
          cd mobile-app
          flutter analyze

  # 4. E2E Selenium Verification & Test Report Generation
  e2e-tests:
    name: Selenium E2E Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Docker Services (Backend & DB)
        run: |
          cd docker
          docker compose up -d --build
          sleep 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd web-app
          npm ci

      - name: Install Web Testing Dependencies (Node.js)
        run: |
          npm install selenium-webdriver exceljs

      - name: Build Web App and Run Selenium E2E Tests (Node.js)
        run: |
          cd web-app
          npm run build
          npm run preview -- --port 5173 &
          sleep 6
          cd ..
          node phone-testing/selenium/selenium_e2e_tests.js

      - name: Generate Excel Test Report Sheet (Node.js)
        run: |
          node phone-testing/selenium/generate_test_report.js

      - name: Upload Excel E2E Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeMentor_E2E_Test_Report
          path: TradeMentor_E2E_Test_Report.xlsx

  # 5. E2E Appium Mobile Verification & Test Report Generation
  mobile-e2e-tests:
    name: Appium E2E Suite
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: |
          cd mobile-app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile-app
          flutter build apk --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Appium and Drivers locally
        run: |
          npm install appium appium-uiautomator2-driver

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Testing Dependencies
        run: |
          pip install pandas openpyxl xlsxwriter Appium-Python-Client selenium

      - name: Run Appium E2E Tests inside Emulator
        uses: reactive-circus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            # Start Appium server locally in the background
            npx appium --log appium.log &
            sleep 8
            # Install the built APK
            adb install mobile-app/build/app/outputs/flutter-apk/app-release.apk
            # Run Python Appium E2E tests
            python phone-testing/appium/appium_e2e_tests.py

      - name: Generate Mobile Excel Test Report
        run: |
          python phone-testing/appium/generate_mobile_report.py

      - name: Upload Excel Mobile E2E Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeMentor_Mobile_E2E_Test_Report
          path: TradeMentor_Mobile_E2E_Test_Report.xlsx



<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TradeMentor: A Real-Time Stock Monitoring and Rule-Based Trading Assistance System. Build strategy alerts, track holdings, and interact with AI technical coaches.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TradeMentor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TradeMentor - Real-Time Stock Monitoring & AI Trading Advisor</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0d1117;
      margin: 0px;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #3b82f6;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.05);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border-left-color: #3b82f6;
      animation: spin 1s linear infinite;
    }
    .loader-text {
      margin-top: 20px;
      font-weight: 500;
      letter-spacing: 1.5px;
      color: #9ca3af;
      font-size: 14px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader-container" id="loading-indicator">
    <div class="spinner"></div>
    <div class="loader-text">INITIALIZING TRADEMENTOR ENGINE...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

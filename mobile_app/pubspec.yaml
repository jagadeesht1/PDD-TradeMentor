name: tradementor
description: "TradeMentor: A Real-Time Stock Monitoring and Rule-Based Trading Assistance System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.1
  web_socket_channel: ^2.4.5
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  
  # Configuration for local assets and fonts
  assets:
    - assets/
    - assets/logos/
